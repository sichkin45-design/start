name: fix
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fix links
        run: |
          find . -name "*.html" -type f -exec sed -i 's|t.me/k_roge_n|https://kuzniza.com|g' {} \;
          find . -name "*.html" -type f -exec sed -i 's|https://kuzniza.com/kuzniza.com|https://kuzniza.com|g' {} \;
          find . -name "*.html" -type f -exec sed -i 's|http://kuzniza.com|https://kuzniza.com|g' {} \;

      - name: commit and push
        run: |
          git config user.name "fix"
          git config user.email "fix@fix.com"
          git add .
          git diff --staged --quiet || git commit -m "kuzniza.com direct"
          git push
